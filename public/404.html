<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TraceLock — Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Stores the current path and query in sessionStorage and redirects to index.html
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var repo = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      // Redirect to the repository root
      window.location.replace(window.location.origin + repo);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">TraceLock</a>...</p>
  </body>
</html>
