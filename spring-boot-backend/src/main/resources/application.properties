# ==========================================
# TraceVault Spring Boot Application Configuration
# ==========================================

server.port=8080
spring.application.name=TraceVault

# Database Connection (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tracevault_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:tracevault_user}
spring.datasource.password=${DB_PASSWORD:change_me_to_secure_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Boundaries (10MB per file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# TraceVault Document Storage Directory (outside public web directory)
tracevault.storage.directory=${STORAGE_PATH:/var/tracevault/documents}
tracevault.storage.temp-directory=${TEMP_STORAGE_PATH:/var/tracevault/temp}

# Background Integrity Verification Scheduler (default: every 60 seconds)
tracevault.scheduler.verification-interval-ms=60000
tracevault.scheduler.batch-size=50

# Actuator Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
